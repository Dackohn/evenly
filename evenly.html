<style>
/* Layout: ledger app. Fixed sidebar of groups and friends, a working column of balances and expense rows. */
:root{
  --paper:#F1F3EF; --surface:#FFFFFF; --sunk:#E6EAE4; --ink:#17201E; --muted:#5A6662; --line:#D5DCD6;
  --accent:#6E2A5A; --accent-ink:#FFFFFF; --accent-soft:#F2E3EC; --bar:#D9C3D2;
  --pos:#14775A; --pos-soft:#DCF0E7; --neg:#B0462A; --neg-soft:#F7E2DA; --warn:#8A5A00; --warn-soft:#FBEFD3;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 8px 24px rgba(20,30,28,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111514; --surface:#191F1D; --sunk:#222926; --ink:#E6ECE9; --muted:#9AA6A1; --line:#2D3633;
  --accent:#DE93C6; --accent-ink:#1C0F18; --accent-soft:#38212F; --bar:#5A3A4F;
  --pos:#5FCB9F; --pos-soft:#15322A; --neg:#F2906F; --neg-soft:#3A2018; --warn:#E8B85A; --warn-soft:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111514; --surface:#191F1D; --sunk:#222926; --ink:#E6ECE9; --muted:#9AA6A1; --line:#2D3633;
  --accent:#DE93C6; --accent-ink:#1C0F18; --accent-soft:#38212F; --bar:#5A3A4F;
  --pos:#5FCB9F; --pos-soft:#15322A; --neg:#F2906F; --neg-soft:#3A2018; --warn:#E8B85A; --warn-soft:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.side-in{display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;flex:1}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--f-display);padding:0 8px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.mark svg{display:block}
.mark rect{fill:var(--accent-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.side-h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 8px 4px}
.side-sec{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:9px;cursor:pointer;min-width:0}
.item:hover{background:var(--sunk)}
.item.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .bal{font:500 12px var(--f-num);white-space:nowrap}
.mini{background:none;border:0;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;padding:2px 4px;letter-spacing:0;text-transform:none}
.side-empty{font-size:13px;color:var(--muted);padding:2px 8px}
.side-foot{border-top:1px solid var(--line);padding:14px 22px 18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.side-foot select{width:100%}
.mode{font-size:12px;color:var(--muted)}
.ico{width:18px;height:18px;flex:none;color:var(--muted)}
.item.on .ico{color:var(--accent)}

.main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vh h1{font-size:clamp(26px,3.2vw,34px);font-weight:800;line-height:1.1}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.vh-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:700}
.card-b{padding:14px 18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px}
.strip>div{padding:16px 20px;display:flex;flex-direction:column;gap:4px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.strip .v{font:600 22px/1.25 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.strip .v small{display:block;font-size:15px}

.rows{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);min-width:0}
.prow:first-child{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .who span{font-size:13px;color:var(--muted)}
.prow .amt{text-align:right;font:600 15px var(--f-num);font-variant-numeric:tabular-nums}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-body);color:#fff}
.av.sm{width:26px;height:26px;font-size:11px}
.avs{display:flex}
.avs .av{border:2px solid var(--surface);margin-left:-8px}
.avs .av:first-child{margin-left:0}

.month{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 18px 6px;background:var(--sunk);border-top:1px solid var(--line)}
.month:first-child{border-top:0;border-radius:14px 14px 0 0}
.xrow{display:grid;grid-template-columns:44px 12px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 18px;cursor:pointer}
.month+.xrow{border-top:0}
.xrow:hover{background:var(--sunk)}
.xrow .dt{display:flex;flex-direction:column;align-items:center;line-height:1.05;color:var(--muted)}
.xrow .dt small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.xrow .dt b{font:600 19px var(--f-num);color:var(--ink)}
.sw{width:12px;height:12px;border-radius:3px}
.xrow .t{min-width:0}
.xrow .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow .t span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow .r{text-align:right;font-size:12px;line-height:1.3}
.xrow .r b{display:block;font:600 14px var(--f-num);font-variant-numeric:tabular-nums}
.xrow.pay .t b{font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:1px;margin-left:6px}
.tag.rec{background:var(--accent-soft);color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.pill.pos{background:var(--pos-soft)} .pill.neg{background:var(--neg-soft)} .pill.z{background:var(--sunk);color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:64px;width:100%}

.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:18px}
.empty p{margin:0;max-width:46ch}
.note{border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:14px}
.note.info{background:var(--accent-soft)} .note.warn{background:var(--warn-soft);color:var(--ink)}
.note p{margin:0;flex:1;min-width:220px}

.hello{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;overflow:hidden}
.hello .l{padding:28px;display:flex;flex-direction:column;gap:14px}
.hello .l h2{font-size:28px;font-weight:800;line-height:1.1}
.hello .l p{margin:0;color:var(--muted);max-width:48ch}
.hello .r{background:var(--sunk);padding:24px 28px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.hello .r li{margin-bottom:6px}
.hello ul{margin:0;padding-left:18px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1;min-width:160px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;align-items:center;gap:12px;font-size:14px}
.bar-row .lab{display:flex;align-items:center;gap:8px;min-width:0}
.bar-row .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font:500 11px var(--f-body)}
.chart .b1{fill:var(--bar)} .chart .b2{fill:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.meter{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter div{height:100%;background:var(--pos);border-radius:99px}
.meter.over div{background:var(--neg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,13,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:20px;font-weight:700}
.dlg-scroll{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot .sp{display:flex;gap:8px;margin-left:auto}
.icon-btn{background:none;border:0;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.icon-btn:hover{background:var(--sunk)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{color:var(--ink);font-weight:400;font-size:15px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2>.fld{flex:1 1 120px}
.row2>.grow{flex:3 1 220px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.parts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px}
.part{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-width:0}
.part:first-child{border-top:0}
.part label{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.part label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part input[type=text]{width:96px;text-align:right;font-family:var(--f-num)}
.part .share{font:500 13px var(--f-num);color:var(--muted);min-width:84px;text-align:right}
.unit{font-size:12px;color:var(--muted);width:14px}
.sum{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.sum.err{background:var(--neg-soft);color:var(--ink)}
.sum.ok{background:var(--pos-soft);color:var(--ink)}
.sub-h{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
details.more{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
details.more[open] summary{margin-bottom:10px}
.morein{display:flex;flex-direction:column;gap:12px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 6px;font-size:14px;cursor:pointer}
.chk label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.big{font:600 34px/1.1 var(--f-num);letter-spacing:-.03em}
.det-lines{display:flex;flex-direction:column;gap:6px;font-size:14px}
.det-lines div{display:flex;justify-content:space-between;gap:12px}
.receipt{max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--sunk)}
.cmt{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.cmt small{color:var(--muted);font-size:12px}
.err-t{color:var(--neg);font-size:13px;font-weight:600}

.fab{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading{color:var(--muted);font-size:14px;padding:6px 0}

@media (max-width:900px){
  .grid3{grid-template-columns:1fr}
  .hello{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .side-in{flex-direction:row;align-items:center;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
  .side-in::-webkit-scrollbar{display:none}
  .brand{font-size:18px;padding:0 6px 0 0}
  .brand .mark{width:26px;height:26px}
  .nav,.side-sec{flex-direction:row;gap:4px}
  .side-h{display:none}
  .side-sec .side-empty{display:none}
  .item{width:auto;white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:5px 12px}
  .item .bal,.item .ico{display:none}
  .item .lbl{overflow:visible}
  .side-foot{display:none}
  .grid2{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr}
  .strip>div+div{border-left:0;border-top:1px solid var(--line)}
  .vh-act .btn.primary{display:none}
  .fab{display:inline-flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:var(--shadow);padding:12px 18px;border-radius:99px}
  .xrow{grid-template-columns:38px 10px minmax(0,1fr) auto;padding:10px 14px;gap:10px}
  .bar-row{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
}
.side-me{display:none}
@media (max-width:820px){.side-me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}}
</style>

<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="view"><p class="loading">Opening your ledger…</p></div></main>

</div>

<script>

const fmtCache = {};
function fmt(c, cur){
  try { const f = fmtCache[cur] ??= new Intl.NumberFormat(undefined,{style:'currency',currency:cur}); return f.format(c/100); }
  catch { return (c/100).toFixed(2)+' '+cur; }
}
function fmtShort(c, cur){
  try { return new Intl.NumberFormat(undefined,{style:'currency',currency:cur,notation:'compact',maximumFractionDigits:1}).format(c/100); }
  catch { return Math.round(c/100)+' '+cur; }
}
function evalExpr(src){
  const s = String(src).replace(/,/g,'.').replace(/\s/g,'');
  if (!s || !/^[\d.+\-*/()]+$/.test(s)) return null;
  let i = 0;
  const num = () => {
    if (s[i]==='(') { i++; const v = add(); if (s[i++]!==')') throw 0; return v; }
    if (s[i]==='-') { i++; return -num(); }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  };
  const mul = () => { let v = num(); while (s[i]==='*'||s[i]==='/') { const o = s[i++]; const r = num(); v = o==='*' ? v*r : v/r; } return v; };
  const add = () => { let v = mul(); while (s[i]==='+'||s[i]==='-') { const o = s[i++]; const r = mul(); v = o==='+' ? v+r : v-r; } return v; };
  try { const v = add(); return (i===s.length && isFinite(v)) ? v : null; } catch { return null; }
}
const parseMoney = s => { const v = evalExpr(s); return v==null ? null : Math.round(v*100); };
const centsStr = c => (c/100).toFixed(2);
function allocate(total, weights){
  const sum = weights.reduce((a,[,w])=>a+w,0); if (sum<=0) return null;
  const out = {}, rems = []; let used = 0;
  for (const [id,w] of weights) { const ex = total*w/sum; const f = Math.floor(ex); out[id] = f; used += f; rems.push([id, ex-f]); }
  rems.sort((a,b)=>b[1]-a[1]);
  for (let k=0, left=total-used; left>0; k++, left--) out[rems[k%rems.length][0]]++;
  return out;
}
function guessCat(desc){
  const d = ' '+desc.toLowerCase()+' ';
  for (const c of CATS) if (c.kw.some(k=>d.includes(k))) return c.k;

}

function initials(n){ const p = String(n||'?').trim().split(/\s+/); return ((p[0]?.[0]||'?') + (p[1]?.[0]||'')).toUpperCase(); }

/* ---------- ledger math ---------- */
function activeExpenses(){
  return Object.entries(S.expenses).map(([id,e])=>({id,...e}))
    .filter(e=>!e.deleted && (!e.groupId || (S.groups[e.groupId] && !S.groups[e.groupId].deleted)))
    .sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
}
function netBal(list){
  const B = {};
  for (const e of list) {
    const m = (B[e.currency] ??= {});
    for (const [p,v] of Object.entries(e.paid||{})) m[p] = (m[p]||0) + v;
    for (const [p,v] of Object.entries(e.owed||{})) m[p] = (m[p]||0) - v;
  }
  return B;
}
function simplifyBal(B){
  const out = [];
  for (const [cur,m] of Object.entries(B)) {
    const cr = [], db = [];
    for (const [p,v] of Object.entries(m)) { if (v>0) cr.push([p,v]); else if (v<0) db.push([p,-v]); }
    while (cr.length && db.length) {
      cr.sort((a,b)=>b[1]-a[1]); db.sort((a,b)=>b[1]-a[1]);
      const x = Math.min(db[0][1], cr[0][1]);
      out.push({cur, from:db[0][0], to:cr[0][0], amt:x});
      db[0][1] -= x; cr[0][1] -= x;
      if (!db[0][1]) db.shift(); if (!cr[0][1]) cr.shift();
    }
  }
  return out;
}
function pairEdges(list){
  const M = {};
  for (const e of list) {
    const m = (M[e.currency] ??= {});
    const payers = Object.entries(e.paid||{}).filter(([,v])=>v>0); if (!payers.length) continue;
    for (const [d,ow] of Object.entries(e.owed||{})) {
      if (ow<=0) continue;
      for (const [p,c] of Object.entries(allocate(ow, payers))) { if (p===d || !c) continue; m[d+'|'+p] = (m[d+'|'+p]||0) + c; }
    }
  }
  const out = [];
  for (const [cur,m] of Object.entries(M)) {
    const seen = new Set();
    for (const k of Object.keys(m)) {
      const [a,b] = k.split('|'); const key = a<b ? a+'|'+b : b+'|'+a; if (seen.has(key)) continue; seen.add(key);
      const v = (m[a+'|'+b]||0) - (m[b+'|'+a]||0);
      if (v>0) out.push({cur,from:a,to:b,amt:v}); else if (v<0) out.push({cur,from:b,to:a,amt:-v});
    }
  }
  return out;
}
function computeAll(){
  const list = activeExpenses();
  const byG = {};
  for (const e of list) (byG[e.groupId||''] ??= []).push(e);
  const edges = [];
  for (const [gid,l] of Object.entries(byG)) {
    const g = S.groups[gid];
    const es = (gid && g && g.simplify!==false) ? simplifyBal(netBal(l)) : pairEdges(l);
    for (const x of es) { x.gid = gid; edges.push(x); }
  }
  S.calc = {list, byG, edges};
}
function addTo(map, cur, v){ map[cur] = (map[cur]||0) + v; }
function myTotals(filter){
  const me = meId(); const owe = {}, owed = {}, net = {};
  if (!me) return {owe, owed, net};
  for (const e of S.calc.edges) {
    if (filter && !filter(e)) continue;
    if (e.from===me) { addTo(owe,e.cur,e.amt); addTo(net,e.cur,-e.amt); }
    if (e.to===me) { addTo(owed,e.cur,e.amt); addTo(net,e.cur,e.amt); }
  }
  return {owe, owed, net};
}
function friendNet(pid){ // >0: friend owes me
  const me = meId(); const net = {};
  for (const e of S.calc.edges) {
    if (e.from===pid && e.to===me) addTo(net,e.cur,e.amt);
    if (e.from===me && e.to===pid) addTo(net,e.cur,-e.amt);
  }
  return net;
}
function memberNet(gid){ return netBal(S.calc.byG[gid]||[]); }
function nonZero(map){ return Object.entries(map).filter(([,v])=>v); }
function balText(map, friend){
  const nz = nonZero(map);
  if (!nz.length) return `<span class="mut">settled up</span>`;
  return nz.map(([c,v])=>`<span class="${v>0?'pos':'neg'}">${v>0?(friend?'owes you ':'you are owed '):'you owe '}${fmt(Math.abs(v),c)}</span>`).join('<br>');
}

/* ---------- storage layer ---------- */
let LOCAL = null;
function saveLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(LOCAL)); } catch {} }
const store = {
  async set(c, id, data){
    if (DB) return guard(()=>DB.collection(c).doc(id).set(data));
    LOCAL[c][id] = data; S[c] = {...LOCAL[c]}; saveLocal(); render();
  },
  async update(c, id, patch){
    if (DB) return guard(()=>DB.collection(c).doc(id).update(patch));
    LOCAL[c][id] = {...LOCAL[c][id], ...patch}; S[c] = {...LOCAL[c]}; saveLocal(); render();
  },
  async del(c, id){
    if (DB) return guard(()=>DB.collection(c).doc(id).delete());
    delete LOCAL[c][id]; S[c] = {...LOCAL[c]}; saveLocal(); render();
  },
};
async function guard(fn, retried){
  try { return await fn(); }
  catch (e) {
    if (e?.code==='unavailable' && !retried) { await new Promise(r=>setTimeout(r, 400+Math.random()*600)); return guard(fn, true); }
    if (e?.code==='invalid_argument') { S.canWrite = false; render(); throw new Error('You can view this ledger but not change it. Ask the owner for Contributor access.'); }
    if (e?.code==='quota_exceeded') throw new Error('The ledger is full. Delete some old expenses and try again.');
    throw new Error(e?.message || 'Could not save. Check your connection and try again.');
  }
}

/* ---------- render: main ---------- */
function render(){
  computeAll();
  renderSide();
  const v = S.view;
  let html = '';
  if (v.name==='group' && v.id && !S.groups[v.id]) S.view = {name:'dashboard'};
  if (v.name==='friend' && !S.people[v.id]) S.view = {name:'dashboard'};
  switch (S.view.name) {
    case 'activity': html = viewActivity(); break;
    case 'all': html = viewAll(); break;
    case 'insights': html = viewInsights(); break;
    case 'group': html = viewGroup(); break;
    case 'friend': html = viewFriend(); break;
    default: html = viewDashboard();
  }
  const banner = !S.canWrite ? `<div class="note warn"><p>You can view this ledger but not change it. Ask the owner to share it with you as a Contributor.</p></div>`
    : S.slow && !allLoaded() ? `<div class="note warn"><p>Still reaching the shared ledger. What you see may be out of date.</p></div>` : '';
  const view = $('#view');
  const ae = document.activeElement; const focusId = ae && view.contains(ae) ? ae.id : null; const sel = focusId && ae.selectionStart;
  view.innerHTML = banner + html;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (sel!=null) el.setSelectionRange(sel, sel); } catch {} } }
  $('#fab').hidden = !S.canWrite || !peopleList().length;
}

  html += `<section class="card"><div class="card-h"><h2>Groups</h2>${S.canWrite?'<button class="btn sm" data-act="add-group">+ New group</button>':''}</div><div class="rows">${
    gs.map(g=>{ const n = (S.calc.byG[g.id]||[]).filter(e=>e.type!=='payment').length; return `<button class="prow item" style="border-radius:0" data-act="nav" data-view="group" data-id="${g.id}"><span class="avs">${g.memberIds.slice(0,4).map(id=>avatar(id,true)).join('')}</span><span class="who"><b>${esc(g.name)}</b><span>${esc(g.kind||'Group')} · ${g.memberIds.length} people · ${n} expense${n===1?'':'s'}</span></span><span class="amt">${me?balText(myTotals(e=>e.gid===g.id).net):''}</span></button>`; }).join('')
    || `<div class="empty"><h3>No groups yet</h3><p>A group keeps one trip, flat or event together, with its own balances.</p>${S.canWrite?'<button class="btn primary" data-act="add-group">Create a group</button>':''}</div>`}</div></section>`;
  const recent = S.calc.list.slice(0,6);
  html += `<section class="card"><div class="card-h"><h2>Latest expenses</h2><button class="btn sm ghost" data-act="nav" data-view="all">See all</button></div>${recent.length ? `<div class="rows">${recent.map(e=>expRow(e,true)).join('')}</div>` : `<div class="empty"><p>No expenses yet. Add the first one with “Add expense”.</p></div>`}</section>`;
  return html;
}

/* expense row */
function expRow(e, showGroup){
  const me = meId(); const d = parseISO(e.date);
  const cat = CAT[e.category] || CAT.other;
  const gname = showGroup ? (e.groupId ? S.groups[e.groupId]?.name : 'Non-group') : '';
  const gtag = gname ? ` · ${esc(gname)}` : '';
  if (e.type==='payment') {
    const [from] = Object.keys(e.paid); const [to] = Object.keys(e.owed);
    const mine = from===me ? `<span class="mut">you paid</span>` : to===me ? `<span class="mut">you received</span>` : '';
    return `<button class="xrow pay" data-act="open-expense" data-id="${e.id}"><span class="dt"><small>${MONTHS[d.getMonth()]}</small><b>${d.getDate()}</b></span><span class="sw" style="background:var(--pos)"></span>
      <span class="t"><b>${esc(nm(from,true))} paid ${esc(nm(to))}</b><span>Payment${gtag}${e.notes?` · ${esc(e.notes)}`:''}</span></span><span class="r"><b>${fmt(e.amount,e.currency)}</b>${mine}</span></button>`;
  }
  const payers = Object.keys(e.paid||{});
  const paidTxt = payers.length===1 ? `${esc(nm(payers[0],true))} paid ${fmt(e.amount,e.currency)}` : `${payers.length} people paid ${fmt(e.amount,e.currency)}`;
  let right = `<span class="mut">not involved</span>`;
  if (me && ((e.paid||{})[me] || (e.owed||{})[me])) {
    const net = ((e.paid||{})[me]||0) - ((e.owed||{})[me]||0);
    right = net>0 ? `<span class="pos">you lent</span><b class="pos">${fmt(net,e.currency)}</b>` : net<0 ? `<span class="neg">you borrowed</span><b class="neg">${fmt(-net,e.currency)}</b>` : `<span class="mut">your share</span><b>${fmt((e.owed||{})[me]||0,e.currency)}</b>`;
  }
  return `<button class="xrow" data-act="open-expense" data-id="${e.id}"><span class="dt"><small>${MONTHS[d.getMonth()]}</small><b>${d.getDate()}</b></span><span class="sw" style="background:${cat.c}" title="${esc(cat.l)}"></span>
    <span class="t"><b>${esc(e.desc)}${e.recurringId?'<span class="tag rec">repeats</span>':''}${e.receiptId?'<span class="tag">receipt</span>':''}${(e.comments||[]).length?`<span class="tag">${e.comments.length} comment${e.comments.length>1?'s':''}</span>`:''}</b><span>${paidTxt}${gtag}</span></span><span class="r">${right}</span></button>`;
}
function monthList(list, showGroup){
  if (!list.length) return '';
  let html = '', cur = '';
  for (const e of list) { const k = e.date.slice(0,7); if (k!==cur) { cur = k; const d = parseISO(k+'-01'); html += `<div class="month">${d.toLocaleString(undefined,{month:'long',year:'numeric'})}</div>`; } html += expRow(e, showGroup); }
  return html;
}
function filterList(list, f){
  const q = (f.q||'').trim().toLowerCase();
  return list.filter(e => (f.gid==='*' || (e.groupId||'')===f.gid) && (f.cat==='*' || (f.cat==='payment' ? e.type==='payment' : e.category===f.cat && e.type!=='payment'))
    && (f.pid==='*' || (e.paid||{})[f.pid]!=null || (e.owed||{})[f.pid]!=null)
    && (!q || (e.desc||'').toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q) || String(e.amount/100).includes(q)));
}

/* activity */
function viewActivity(){
  const items = [];
  for (const [id,e] of Object.entries(S.expenses)) {
    const g = e.groupId ? S.groups[e.groupId] : null; if (g?.deleted) continue;
    items.push({t:e.createdAt||0, id, e, verb: e.auto ? 'repeated' : 'added', by:e.createdBy});
    if (e.updatedAt && e.updatedAt - (e.createdAt||0) > 2000 && !e.deleted) items.push({t:e.updatedAt, id, e, verb:'updated', by:e.updatedBy});
    if (e.deleted) items.push({t:e.deletedAt||e.updatedAt||0, id, e, verb:'deleted', by:e.deletedBy});
  }
  for (const [id,g] of Object.entries(S.groups)) items.push({t:g.createdAt||0, gid:id, g, verb: g.deleted?'deleted group':'created group', by: g.deleted ? g.updatedBy : g.createdBy});
  items.sort((a,b)=>b.t-a.t);
  const shown = items.slice(0,80);
  ensureProfiles(shown.map(i=>i.by));
  let html = header('Activity', 'Recent activity', stdActions());
  const rows = shown.map(it=>{
    const when = it.t ? new Date(it.t).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : '';
    if (it.g) return `<div class="prow">${icon('group')}<div class="who"><b>${esc(who(it.by))} ${it.verb} “${esc(it.g.name)}”</b><span>${when}</span></div></div>`;
    const e = it.e; const gname = e.groupId ? S.groups[e.groupId]?.name : 'Non-group';
    const label = e.type==='payment' ? `a payment from ${esc(nm(Object.keys(e.paid)[0]))} to ${esc(nm(Object.keys(e.owed)[0]))}` : `“${esc(e.desc)}”`;
    const act = it.verb==='deleted' ? (S.canWrite && e.deleted ? `<button class="btn sm" data-act="restore-expense" data-id="${it.id}">Restore</button>` : '') : (!e.deleted ? `<button class="btn sm ghost" data-act="open-expense" data-id="${it.id}">View</button>` : '');
    return `<div class="prow"><span class="sw" style="background:${e.type==='payment'?'var(--pos)':(CAT[e.category]||CAT.other).c};flex:none"></span><div class="who"><b style="white-space:normal">${esc(who(it.by))} ${it.verb} ${label}</b><span>${esc(gname||'')} · ${fmt(e.amount,e.currency)} · ${when}</span></div>${act}</div>`;
  }).join('');
  html += `<section class="card"><div class="rows">${rows || '<div class="empty"><p>Nothing has happened yet.</p></div>'}</div></section>`;
  return html;
}

function totalsBlock(list, members){
  const me = meId(); const tot = {}, mine = {}, paidMe = {};
  for (const e of list) { addTo(tot,e.currency,e.amount); if (me) { addTo(mine,e.currency,(e.owed||{})[me]||0); addTo(paidMe,e.currency,(e.paid||{})[me]||0); } }
  const curs = Object.keys(tot);
  if (!curs.length) return `<section class="card"><div class="empty"><p>No spending recorded yet.</p></div></section>`;
  const cur = curs.sort((a,b)=>tot[b]-tot[a])[0];
  const l = list.filter(e=>e.currency===cur);
  const byCat = {}; l.forEach(e=>addTo(byCat,e.category||'other',e.amount));
  const byPerson = {}; l.forEach(e=>{ for (const [p,v] of Object.entries(e.owed||{})) addTo(byPerson,p,v); });
  const fmtL = m => nonZero(m).map(([c,v])=>fmt(v,c)).join(' + ') || fmt(0,cur);
  return `<section class="strip"><div><span class="k">Group spending</span><span class="v">${fmtL(tot)}</span></div><div><span class="k">Your share</span><span class="v">${me?fmtL(mine):'—'}</span></div><div><span class="k">You paid</span><span class="v">${me?fmtL(paidMe):'—'}</span></div></section>
    <div class="grid2"><section class="card"><div class="card-h"><h2>By category</h2><span class="mut" style="font-size:13px">${cur}</span></div><div class="card-b">${catBars(byCat, cur)}</div></section>
    <section class="card"><div class="card-h"><h2>Share per person</h2><span class="mut" style="font-size:13px">${cur}</span></div><div class="card-b"><div class="bars">${
      Object.entries(byPerson).sort((a,b)=>b[1]-a[1]).map(([p,v])=>{ const max = Math.max(...Object.values(byPerson)); return `<div class="bar-row"><span class="lab">${avatar(p,true)}<span>${esc(nm(p,true))}</span></span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%;background:hsl(${hueOf(p)} 42% 50%)"></div></div><span class="num">${fmt(v,cur)}</span></div>`; }).join('')}</div></div></section></div>`;
}
function catBars(byCat, cur){
  const tot = Object.values(byCat).reduce((a,b)=>a+b,0);
  const rows = Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if (!rows.length) return '<p class="mut" style="margin:0">Nothing in this period.</p>';
  const max = rows[0][1];
  return `<div class="bars">${rows.map(([k,v])=>{ const c = CAT[k]||CAT.other; return `<div class="bar-row"><span class="lab"><span class="sw" style="background:${c.c};flex:none"></span><span>${c.l}</span></span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%;background:${c.c}"></div></div><span class="num">${fmt(v,cur)} <span class="mut">${Math.round(v/tot*100)}%</span></span></div>`; }).join('')}</div>`;
}

/* friend */
function viewFriend(){
  const pid = S.view.id; const p = S.people[pid]; const me = meId();
  const net = me ? friendNet(pid) : {};
  let html = header('Friend', esc(p.name), stdActions(S.canWrite?`<button class="btn" data-act="edit-person" data-id="${pid}">Edit</button>`:''));

      ${nz.length&&S.canWrite?`<button class="btn primary" data-act="settle" data-from="${nz[0][1]>0?pid:me}" data-to="${nz[0][1]>0?me:pid}" data-amt="${Math.abs(nz[0][1])}" data-cur="${nz[0][0]}">Settle up</button>`:''}</div>

  if (S.canWrite) html += `<div><button class="btn danger sm" data-act="del-person" data-id="${pid}">Remove ${esc(p.name)}</button></div>`;
  return html;
}

/* insights */
function periodStart(k){
  const d = new Date(); d.setHours(0,0,0,0);
  if (k==='1m') return iso(new Date(d.getFullYear(), d.getMonth(), 1));
  if (k==='lm') return iso(new Date(d.getFullYear(), d.getMonth()-1, 1));
  if (k==='3m') return iso(new Date(d.getFullYear(), d.getMonth()-2, 1));
  if (k==='12m') return iso(new Date(d.getFullYear(), d.getMonth()-11, 1));
  if (k==='y') return iso(new Date(d.getFullYear(), 0, 1));
  return '0000-00-00';
}
function periodEnd(k){ const d = new Date(); return k==='lm' ? iso(new Date(d.getFullYear(), d.getMonth(), 0)) : '9999-12-31'; }
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,2,2.5,5,10]) if (m*p >= v) return m*p; return 10*p; }
function viewInsights(){
  const f = S.ins; const me = meId();
  const all = S.calc.list.filter(e=>e.type!=='payment' && (f.gid==='*' || (e.groupId||'')===f.gid));
  const curCount = {}; all.forEach(e=>addTo(curCount,e.currency,1));
  const curs = Object.keys(curCount).sort((a,b)=>curCount[b]-curCount[a]);
  if (!f.cur || !curCount[f.cur]) f.cur = curs[0] || S.prefs.currency || 'MDL';
  const cur = f.cur;
  const basisMine = f.basis==='mine' && me;
  const val = e => basisMine ? ((e.owed||{})[me]||0) : e.amount;
  const st = periodStart(f.period), en = periodEnd(f.period);
  const list = all.filter(e=>e.currency===cur && e.date>=st && e.date<=en);
  const total = list.reduce((a,e)=>a+e.amount,0);
  const mine = me ? list.reduce((a,e)=>a+((e.owed||{})[me]||0),0) : 0;
  const paid = me ? list.reduce((a,e)=>a+((e.paid||{})[me]||0),0) : 0;
  const byCat = {}; list.forEach(e=>addTo(byCat,e.category||'other',val(e)));
  // months
  const now = new Date(); const months = [];
  for (let i=11; i>=0; i--) { const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({k:iso(d).slice(0,7), label:MONTHS[d.getMonth()], total:0, mine:0}); }
  const mi = Object.fromEntries(months.map((m,i)=>[m.k,i]));
  all.filter(e=>e.currency===cur).forEach(e=>{ const i = mi[e.date.slice(0,7)]; if (i!=null) { months[i].total += e.amount; months[i].mine += me ? ((e.owed||{})[me]||0) : 0; } });
  // payers
  const payers = {}; list.forEach(e=>{ for (const [p,v] of Object.entries(e.paid||{})) addTo(payers,p,v); });
  // budget
  const bCur = S.prefs.budgetCur || cur; const budget = S.prefs.budget || 0;
  const mStart = periodStart('1m');
  const spentMonth = me ? S.calc.list.filter(e=>e.type!=='payment' && e.currency===bCur && e.date>=mStart).reduce((a,e)=>a+((e.owed||{})[me]||0),0) : 0;
  const daysIn = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const pace = Math.round(spentMonth / now.getDate() * daysIn);

  let html = header('Insights', 'Where the money goes', `<button class="btn" data-act="export">Export CSV</button>`);
  html += `<div class="toolbar">

function renderDyn(){

  $('#f-dyn').innerHTML = `

    ${F.payer==='multi' ? `<div class="parts" aria-label="How much each person paid">${names.map(([id,n])=>`<div class="part"><label for="pv-${id}">${avatar(id,true)}<span>${esc(n)}</span></label><input type="text" inputmode="decimal" id="pv-${id}" data-pv="${id}" value="${esc(F.paidVals[id]||'')}" placeholder="0.00"></div>`).join('')}</div>` : ''}
    <div class="sub-h"><span>Split</span>${F.method==='equal'||F.method==='adjust'?`<span><button type="button" class="link" data-act="f-all">All</button> · <button type="button" class="link" data-act="f-none">None</button></span>`:''}</div>
    <div class="seg" role="group" aria-label="Split method">${METHODS.map(([k,l])=>`<button type="button" class="${F.method===k?'on':''}" data-act="f-method" data-m="${k}">${l}</button>`).join('')}</div>
    <div class="parts">${names.map(([id,n])=>{
      const box = (F.method==='equal'||F.method==='adjust');
      return `<div class="part"><label for="${box?'sel-'+id:'v-'+id}">${box?`<input type="checkbox" id="sel-${id}" data-sel="${id}"${F.sel.has(id)?' checked':''}>`:''}${avatar(id,true)}<span>${esc(n)}</span></label>
        ${F.method!=='equal' ? `<span class="unit">${unit}</span><input type="text" inputmode="decimal" id="v-${id}" data-v="${id}" value="${esc(F.vals[id]||'')}" placeholder="${F.method==='shares'?'1':'0'}">` : ''}
        <span class="share" id="sh-${id}"></span></div>`; }).join('')}</div>
    <p class="mut" style="margin:0;font-size:13px">${{equal:'Everyone ticked pays the same.',exact:'Type how much each person owes. Leave blank for people not involved.',percent:'Percentages must add up to 100.',shares:'For example, 2 shares for a couple and 1 for a single person.',adjust:'Add or subtract an amount for someone, for example +20 for a starter only they had. The rest is split equally.'}[F.method]}</p>`;
}
function splitIds(pool){
  if (F.method==='equal'||F.method==='adjust') return pool.filter(id=>F.sel.has(id));
  if (F.method==='exact') return pool.filter(id=>(parseMoney(F.vals[id]||'')||0)!==0);
  return pool.filter(id=>(evalExpr(F.vals[id]||'')||0)>0);
}
function computeSplit(total){
  const pool = poolFor(F.gid); const ids = splitIds(pool);
  if (!ids.length) return {error:'Choose who this expense is split between.'};
  if (F.method==='equal') return {owed: allocate(total, ids.map(id=>[id,1]))};
  if (F.method==='exact') {
    const owed = {}; let s = 0;
    for (const id of ids) { const c = parseMoney(F.vals[id]); if (c==null || c<0) return {error:`Check the amount for ${nm(id)}.`}; owed[id] = c; s += c; }
    if (s!==total) return {owed, error: s<total ? `${fmt(total-s,F.cur)} is not assigned to anyone yet.` : `The amounts are ${fmt(s-total,F.cur)} more than the total.`};
    return {owed};
  }
  if (F.method==='percent') {
    const s = ids.reduce((a,id)=>a+evalExpr(F.vals[id]),0);
    if (Math.abs(s-100)>0.001) return {error:`Percentages add up to ${+s.toFixed(2)}%. They need to add up to 100%.`};
    return {owed: allocate(total, ids.map(id=>[id, evalExpr(F.vals[id])]))};
  }
  if (F.method==='shares') return {owed: allocate(total, ids.map(id=>[id, evalExpr(F.vals[id])]))};
  if (F.method==='adjust') {
    const adj = {}; let s = 0;
    for (const id of ids) { const c = parseMoney(F.vals[id]||'0') ?? null; if (c==null) return {error:`Check the adjustment for ${nm(id)}.`}; adj[id] = c; s += c; }
    if (s>total) return {error:'The adjustments are more than the total.'};
    const base = allocate(total-s, ids.map(id=>[id,1]));
    const owed = {}; for (const id of ids) { owed[id] = base[id]+adj[id]; if (owed[id]<0) return {error:`${nm(id,true)} would end up with a negative share.`}; }
    return {owed};
  }
}
function computePaid(total){
  if (F.payer!=='multi') return {paid:{[F.payer]:total}};
  const paid = {}; let s = 0;
  for (const id of poolFor(F.gid)) { const v = F.paidVals[id]; if (!v) continue; const c = parseMoney(v); if (c==null||c<0) return {error:`Check what ${nm(id)} paid.`}; if (c) { paid[id] = c; s += c; } }
  if (!s) return {error:'Enter how much each person paid.'};
  if (s!==total) return {paid, error:`The payers add up to ${fmt(s,F.cur)}, but the total is ${fmt(total,F.cur)}.`};
  return {paid};
}
function updateSum(){
  const total = parseMoney(F.amount);
  const sum = $('#f-sum'); if (!sum) return;
  for (const id of poolFor(F.gid)) { const el = $('#sh-'+id); if (el) el.textContent = ''; }
  if (!total || total<=0) { sum.className = 'sum'; sum.textContent = F.amount.trim() ? 'Enter an amount above zero.' : 'Enter the amount to see each person’s share.'; return; }
  const sp = computeSplit(total); const pd = computePaid(total);
  if (sp.owed) for (const [id,c] of Object.entries(sp.owed)) { const el = $('#sh-'+id); if (el) el.textContent = fmt(c, F.cur); }
  const err = pd.error || sp.error;
  sum.className = 'sum ' + (err ? 'err' : 'ok');
  if (err) { sum.textContent = err; return; }
  const n = Object.keys(sp.owed).length;
  const exprNote = /[+\-*/]/.test(F.amount.replace(/^-/,'')) ? `${fmt(total,F.cur)} in total. ` : '';
  sum.textContent = `${exprNote}Split between ${n} ${n===1?'person':'people'}${F.method==='equal'&&n>1?`, ${fmt(Math.floor(total/n),F.cur)} each`:''}.`;
}
function onFormInput(e){
  const t = e.target;
  if (t.id==='f-desc') { F.desc = t.value; if (!F.catTouched) { const g = guessCat(t.value); if (g) { F.cat = g; $('#f-cat').value = g; } } return; }
  if (t.id==='f-amt') F.amount = t.value;
  if (t.id==='f-notes') F.notes = t.value;
  if (t.dataset.v) F.vals[t.dataset.v] = t.value;
  if (t.dataset.pv) F.paidVals[t.dataset.pv] = t.value;
  updateSum();
}
function onFormChange(e){
  const t = e.target;
  if (t.id==='f-cat') { F.cat = t.value; F.catTouched = true; }
  if (t.id==='f-cur') { F.cur = t.value; updateSum(); }
  if (t.id==='f-date') F.date = t.value;
  if (t.id==='f-repeat') F.repeat = t.value;
  if (t.id==='f-file') F.file = t.files[0] || null;
  if (t.id==='f-group') { F.gid = t.value; const g = S.groups[F.gid]; if (g && !F.id) { F.cur = g.currency; $('#f-cur').value = g.currency; } F.sel = new Set(poolFor(F.gid)); renderDyn(); updateSum(); }
  if (t.id==='f-payer') { F.payer = t.value; if (t.value==='multi' && !Object.keys(F.paidVals).length && parseMoney(F.amount)) F.paidVals = {}; renderDyn(); updateSum(); }
  if (t.dataset.sel) { t.checked ? F.sel.add(t.dataset.sel) : F.sel.delete(t.dataset.sel); updateSum(); }
}
async function saveExpense(ev){
  ev.preventDefault();
  const err = m => { const el = $('#f-err'); el.textContent = m; el.hidden = false; };
  const total = parseMoney(F.amount);
  if (!F.desc.trim()) return err('Add a short description, such as “Groceries”.');
  if (!total || total<=0) return err('Enter an amount above zero.');
  if (!F.date) return err('Pick a date.');
  const pd = computePaid(total); if (pd.error) return err(pd.error);
  const sp = computeSplit(total); if (sp.error) return err(sp.error);
  const btn = $('#f-save'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    let receiptId = F.receiptId;
    if (F.file && S.assets) { const up = await S.assets.upload(F.file); receiptId = up.id; }
    const owed = Object.fromEntries(Object.entries(sp.owed).filter(([,v])=>v>0));
    const keepVals = F.method==='equal' ? {} : Object.fromEntries(splitIds(poolFor(F.gid)).map(id=>[id, String(F.vals[id]||'')]));
    const body = {type:'expense', groupId:F.gid, desc:F.desc.trim(), category:F.cat, currency:F.cur, amount:total, date:F.date, paid:pd.paid, owed,
      split:{method:F.method, vals:keepVals}, notes:F.notes.trim(), receiptId:receiptId||null};
    if (F.id) { const old = S.expenses[F.id]; await store.set('expenses', F.id, {...old, ...body, ...stamp()}); toast('Expense updated'); }
    else {
      const eid = newId();
      let recurringId = null;
      if (F.repeat!=='none') {
        recurringId = newId();
        const tmpl = {...body, receiptId:null, notes:body.notes};
        await store.set('recurring', recurringId, {groupId:F.gid, template:tmpl, freq:F.repeat, anchorDay:parseISO(F.date).getDate(), nextDate:advance(F.date, F.repeat, parseISO(F.date).getDate()), active:true, ...created()});
      }
      await store.set('expenses', eid, {...body, comments:[], recurringId, deleted:false, ...created()});
      if (!S.prefs.currency || S.prefs.currency!==F.cur) setPrefs({currency:F.cur});
      toast(F.repeat!=='none' ? `Expense added. It repeats ${F.repeat==='weekly'?'every week':F.repeat==='monthly'?'every month':'every year'}.` : 'Expense added');
    }
    closeDialog();
  } catch (e) { btn.disabled = false; btn.textContent = 'Save'; err(e.message); }
}
function advance(dateISO, freq, anchor){
  const d = parseISO(dateISO);
  if (freq==='weekly') { d.setDate(d.getDate()+7); return iso(d); }
  const y = d.getFullYear() + (freq==='yearly'?1:0), m = d.getMonth() + (freq==='monthly'?1:0);
  const last = new Date(y, m+1, 0).getDate();
  return iso(new Date(y, m, Math.min(anchor||d.getDate(), last)));
}

/* settle up */
function openSettle(pre={}){
  const ex = pre.editId ? S.expenses[pre.editId] : null;
  const me = meId(); const people = peopleList();
  const gid = ex ? (ex.groupId||'') : (pre.gid ?? (S.view.name==='group' ? S.view.id : ''));
  let from = ex ? Object.keys(ex.paid)[0] : pre.from, to = ex ? Object.keys(ex.owed)[0] : pre.to;
  if (!from && !to) { // suggest the first debt involving me
    const e1 = S.calc.edges.find(x=>(gid==='' || x.gid===gid) && (x.from===me||x.to===me)) || S.calc.edges.find(x=>x.gid===gid);
    if (e1) { from = e1.from; to = e1.to; pre.amt = e1.amt; pre.cur = e1.cur; }
  }
  from ||= me || people[0]?.id; to ||= people.find(p=>p.id!==from)?.id;
  const amt = ex ? centsStr(ex.amount) : pre.amt ? centsStr(+pre.amt) : '';
  const cur = ex ? ex.currency : pre.cur || S.groups[gid]?.currency || S.prefs.currency || 'MDL';
  const opts = sel => people.map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(nm(p.id,true))}</option>`).join('');
  openDialog(`<form class="dlg" id="sf" novalidate>${head(ex?'Edit payment':'Record a payment')}<div class="dlg-scroll">
    <div class="row2"><label class="fld">Who paid<select id="s-from">${opts(from)}</select></label><label class="fld">Paid to<select id="s-to">${opts(to)}</select></label></div>

    <label class="fld">Note<input id="s-notes" maxlength="120" placeholder="e.g. Cash, bank transfer, MIA" value="${esc(ex?.notes||'')}"></label>
    <p class="mut" style="margin:0;font-size:13px">This records money that changed hands outside the app. Evenly does not send money.</p>
    <p class="err-t" id="s-err" hidden></p></div>
    <footer class="dlg-foot">${ex?`<button type="button" class="btn danger" data-act="del-expense" data-id="${pre.editId}">Delete</button>`:''}<span class="sp"><button type="button" class="btn ghost" data-act="close-dlg">Cancel</button><button class="btn primary" type="submit">Save payment</button></span></footer></form>`, ()=>{
      $('#sf').addEventListener('submit', async ev=>{
        ev.preventDefault();
        const err = m => { const el = $('#s-err'); el.textContent = m; el.hidden = false; };
        const f = $('#s-from').value, t = $('#s-to').value, a = parseMoney($('#s-amt').value);
        if (!f || !t || f===t) return err('Choose two different people.');
        if (!a || a<=0) return err('Enter an amount above zero.');
        const g = $('#s-group').value;
        const body = {type:'payment', groupId:g, desc:'Payment', category:'other', currency:$('#s-cur').value, amount:a, date:$('#s-date').value||todayISO(), paid:{[f]:a}, owed:{[t]:a}, notes:$('#s-notes').value.trim()};
        try {
          if (ex) await store.set('expenses', pre.editId, {...ex, ...body, ...stamp()});
          else await store.set('expenses', newId(), {...body, comments:[], deleted:false, ...created()});
          closeDialog(); toast(ex ? 'Payment updated' : `Recorded: ${nm(f,true)} paid ${nm(t)} ${fmt(a, body.currency)}`);

/* ---------- recurring ---------- */
let recurBusy = false;
async function runRecurring(){
  if (recurBusy || !allLoaded() || !S.canWrite) return;
  recurBusy = true;
  try {
    const today = todayISO();
    for (const [rid, r0] of Object.entries(S.recurring)) {
      let r = r0;
      if (!r.active || r.nextDate > today) continue;
      if (r.groupId && (!S.groups[r.groupId] || S.groups[r.groupId].deleted)) continue;
      if (DB) {
        const ref = DB.collection('recurring').doc(rid);
        const lease = await ref.acquire({holder:S.tabId, ttlMs:20000}); if (!lease.acquired) continue;
        const snap = await ref.get(); if (!snap.exists) continue; r = snap.data();
        if (!r.active || r.nextDate > today) continue;
      }
      let next = r.nextDate, n = 0;
      while (next <= today && n < 24) {
        await store.set('expenses', newId(), {...r.template, date:next, comments:[], deleted:false, recurringId:rid, auto:true, createdAt:Date.now(), createdBy:r.createdBy||null, updatedAt:Date.now(), updatedBy:null});
        next = advance(next, r.freq, r.anchorDay); n++;
      }
      await store.update('recurring', rid, {nextDate:next});
    }
  } catch (e) { console.warn('Repeating expenses', e); }
  finally { recurBusy = false; }
}

/* ---------- CSV export ---------- */
async function exportCSV(gid){
  const list = gid!=null ? (S.calc.byG[gid]||[]) : S.view.name==='all' ? filterList(S.calc.list, S.filt) : S.calc.list;
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = [['Date','Type','Description','Category','Group','Currency','Amount','Paid by','Split between','Notes'].map(q).join(',')];
  for (const e of [...list].reverse()) {
    rows.push([e.date, e.type, e.type==='payment'?`${nm(Object.keys(e.paid)[0],true)} paid ${nm(Object.keys(e.owed)[0])}`:e.desc, e.type==='payment'?'Payment':(CAT[e.category]||CAT.other).l,
      e.groupId?S.groups[e.groupId]?.name:'Non-group', e.currency, centsStr(e.amount),
      Object.entries(e.paid).map(([p,v])=>`${S.people[p]?.name||'?'}: ${centsStr(v)}`).join('; '),
      Object.entries(e.owed).map(([p,v])=>`${S.people[p]?.name||'?'}: ${centsStr(v)}`).join('; '), e.notes||''].map(q).join(','));
  }
  const name = (gid ? S.groups[gid]?.name : 'evenly-expenses') || 'expenses';
  const filename = name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase() + '-' + todayISO() + '.csv';
  if (!S.downloads) { toast('Downloads are not available here.'); return; }
  try { await S.downloads.save({filename, data:'﻿'+rows.join('\r\n')}); } catch (e) { if (e?.code!=='cancelled' && e?.code!=='declined') toast('The file was not saved.'); }
}

/* ---------- events ---------- */
const ACT = {
  'nav': d => { S.view = {name:d.view, id:d.id ?? null, tab:'expenses'}; render(); window.scrollTo(0,0); },
  'tab': d => { S.view.tab = d.tab; render(); },
  'add-expense': () => { if (!peopleList().length) return toast('Add yourself first.'); openExpense(null); },
  'edit-expense': d => openExpense(d.id),
  'open-expense': d => openDetail(d.id),
  'del-expense': async d => {
    const e = S.expenses[d.id];
    if (!await askConfirm(e.type==='payment'?'Delete this payment?':`Delete “${esc(e.desc)}”?`, 'Balances will update. You can restore it from Recent activity.', 'Delete')) return;
    try { await store.update('expenses', d.id, {deleted:true, deletedAt:Date.now(), deletedBy:S.uid||null}); toast('Deleted. Restore it from Recent activity.'); } catch (er) { toast(er.message); }
  },
  'restore-expense': async d => { try { await store.update('expenses', d.id, {deleted:false, ...stamp()}); toast('Restored'); } catch (er) { toast(er.message); } },
  'settle': d => openSettle({from:d.from, to:d.to, amt:d.amt, cur:d.cur, gid:d.gid}),
  'add-group': () => openGroup(null),
  'edit-group': () => openGroup(S.view.id),
  'del-group': async () => {
    const g = S.groups[S.view.id];
    const open = S.calc.edges.some(e=>e.gid===S.view.id);
    if (!await askConfirm(`Delete “${esc(g.name)}”?`, open ? 'Some people in this group still owe money. Deleting the group removes those balances from everyone’s totals.' : 'The group and its expenses will no longer appear.', 'Delete group')) return;
    try { await store.update('groups', S.view.id, {deleted:true, ...stamp()}); S.view = {name:'dashboard'}; render(); toast('Group deleted'); } catch (er) { toast(er.message); }
  },
  'add-person': () => openPerson(null),
  'edit-person': d => openPerson(d.id),
  'del-person': async d => {
    const has = S.calc.edges.some(e=>e.from===d.id||e.to===d.id);
    if (has) return toast(`${nm(d.id,true)} still has a balance. Settle up first.`);
    if (!await askConfirm(`Remove ${esc(S.people[d.id].name)}?`, 'Past expenses keep their name. They will no longer appear in lists or new expenses.', 'Remove')) return;
    try { await store.update('people', d.id, {deleted:true, ...stamp()}); S.view = {name:'dashboard'}; render(); } catch (er) { toast(er.message); }
  },
  'stop-recur': async d => { try { await store.update('recurring', d.id, {active:false, ...stamp()}); toast('This expense will no longer repeat'); } catch (er) { toast(er.message); } },
  'export': d => exportCSV(d.gid ?? (S.view.name==='insights' ? null : undefined)),
  'example': () => loadExample(),
  'clear-example': () => clearExample(),
  'close-dlg': () => closeDialog(),
  'f-method': d => {
    F.method = d.m;
    // start each method from an even split of the people currently ticked
    const ids = poolFor(F.gid).filter(id=>F.sel.has(id)); const n = ids.length || 1; const total = parseMoney(F.amount) || 0;
    F.vals = {};
    if (d.m==='shares') ids.forEach(id=>F.vals[id] = '1');
    if (d.m==='percent') { const base = Math.floor(10000/n)/100; ids.forEach((id,i)=>F.vals[id] = String(i===n-1 ? +(100-base*(n-1)).toFixed(2) : base)); }
    if (d.m==='exact' && total) { const al = allocate(total, ids.map(id=>[id,1])); ids.forEach(id=>F.vals[id] = centsStr(al[id])); }
    renderDyn(); updateSum();
  },
  'f-all': () => { F.sel = new Set(poolFor(F.gid)); renderDyn(); updateSum(); },
  'f-none': () => { F.sel = new Set(); renderDyn(); updateSum(); },
  'ins-basis': d => { S.ins.basis = d.k; render(); },
};

    try { const pid = newId(); await store.set('people', pid, {name, deleted:false, ...created()}); await setPrefs({meId:pid}); toast(`Welcome, ${name}. Now create a group.`); } catch (er) { toast(er.message); }
  }
  if (e.target.id==='budget-form') {
    e.preventDefault(); const v = $('#bud-amt').value.trim(); const c = v ? parseMoney(v) : 0;
    if (c==null || c<0) return toast('Enter a valid amount.');
    await setPrefs({budget:c, budgetCur:$('#bud-cur').value}); toast(c ? 'Budget saved' : 'Budget removed');
  }
});

/* ---------- startup ---------- */
function startLocal(){
  S.mode = 'local';
  try { LOCAL = JSON.parse(localStorage.getItem(LOCAL_KEY)) || null; } catch {}
  LOCAL ||= {people:{}, groups:{}, expenses:{}, recurring:{}};
  for (const c of ['people','groups','expenses','recurring']) { S[c] = {...LOCAL[c]}; S.loaded[c] = true; }
  try { S.prefs = JSON.parse(localStorage.getItem(LOCAL_KEY+'-prefs')) || {}; } catch {}
  render(); setTimeout(runRecurring, 300);
}
async function start(){
  S.tabId = newId();
  render();
  if (!window.claude?.use) { await new Promise(r=>setTimeout(r, 300)); if (!window.claude?.use) return startLocal(); }
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db) return startLocal();
  DB = db; S.user = user; S.mode = 'db';
  if (user) {
    S.uid = await user.id();
    const cw = await user.can('data.write'); if (cw===false) S.canWrite = false;
  }
  window.claude.use('assets').then(a=>{ S.assets = a; }).catch(()=>{});
  window.claude.use('downloads').then(d=>{ S.downloads = d; }).catch(()=>{});
  const slowT = setTimeout(()=>{ S.slow = true; render(); }, 10000);
  let recurT;
  for (const c of ['people','groups','expenses','recurring']) {
    DB.collection(c).onSnapshot(snap=>{
      S[c] = Object.fromEntries(snap.docs.map(d=>[d.id, d.data()]));
      if (!snap.metadata.fromCache) S.loaded[c] = true;
      if (allLoaded()) { clearTimeout(slowT); S.slow = false; clearTimeout(recurT); recurT = setTimeout(runRecurring, 800); }
      render();
    }, err=>{ S.loaded[c] = true; console.warn(c, err); render(); });
  }
  if (S.uid) DB.doc(`data/users/${S.uid}/prefs`).onSnapshot(s=>{ S.prefs = s.exists ? {...s.data()} : {}; render(); }, ()=>{});
  else { try { S.prefs = JSON.parse(localStorage.getItem(LOCAL_KEY+'-prefs')) || {}; } catch {} }
  render();
}
start();
</script>
